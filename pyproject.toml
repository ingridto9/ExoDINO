[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exodino"
version = "0.1.0"
description = "Multi-level DINOv2 semantic segmentation for open lumbar microdiscectomy"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
