experiment_name: fold2
seed: 42
data:
  root_dir: ${EXODISC_DATA_ROOT}
  operation_prefix: op
  images_dir_name: images
  masks_dir_name: masks_semantic
  train_operations:
  - 1
  - 3
  - 4
  val_operations:
  - 2
  image_size: 504
  num_workers: 4
  batch_size: 8
  include_empty_masks: true
  class_names:
  - background
  - aspirator
  - burr
  - retractor
  - spatula
  - forceps
  - scalpel
  - curettes
  - electrocautery
  - dura
  - ligament
  - herniation
  - disc
model:
  model_name: facebook/dinov2-base
  num_classes: 13
  selected_layers:
  - 3
  - 6
  - 9
  - 12
  freeze_backbone: true
  unfreeze_last_n_layers: 0
  decoder_dim: 256
  dropout: 0.1
  interpolate_pos_encoding: true
augmentation:
  enabled: true
  cutmix_probability: 0.5
  cutmix_alpha: 1.0
training:
  epochs: 50
  lr_backbone: 1.0e-05
  lr_head: 0.0001
  weight_decay: 0.0001
  dice_weight: 1.0
  ce_weight: 1.0
  amp: true
  resume: null
output_dir: runs/legacy_ablations/AB2_frozen
